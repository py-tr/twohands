{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

{%- elif name == 'camera' %}<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
{%- elif name == 'inbox' %}<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>
{%- elif name == 'review' %}<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>

{%- elif name == 'forms' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>
{%- elif name == 'upload' %}<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>
{%- elif name == 'image' %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>
{%- elif name == 'check' %}<path d="M5 12l5 5 9-10"/>
{%- elif name == 'shield' %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>
{%- elif name == 'alert' %}<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>
{%- elif name == 'download' %}<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>
{%- elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'play' %}<path d="M7 4l13 8-13 8z"/>
{%- elif name == 'refresh' %}<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
{%- elif name == 'copy' %}<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>
{%- elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'empty' %}<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro source(text) -%}
<span class="src-tip" tabindex="0">{{ icon('info') }}source<span class="tip">{{ text }}</span></span>
{%- endmacro %}
