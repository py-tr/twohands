[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twohands"
version = "1.0.0"
description = "Two Hands: the model reads, the paper decides. Audit keyed data against the paper it was keyed from."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pyyaml>=6",
    # the audit, its report page and the Evolus client reuse the web app's modules
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# the MCP server (the official SDK); mcp 1.x FastMCP or mcp 2.x MCPServer both work
mcp = ["mcp>=1.10"]
test = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
twohands = "twohands.cli:main"
twohands-mcp = "twohands.mcp_server:main"

# Editable install from the repository (pip install -e ".[mcp]"): the modules read schemas/, results/, templates/,
# static/ and app/data/ next to them, so the data stays in the repository and is not packaged.
[tool.setuptools.packages.find]
include = ["twohands", "app", "evolus", "ledger"]
