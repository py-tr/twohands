# Static mirror on GitHub Pages: every public page as static HTML with relative links (works under /<repo>/).
# Builds from the committed results only; no secrets are used or needed. Inert until the repo has a GitHub remote
# and Pages is set to "GitHub Actions" (Settings -> Pages). Set the repository variable MAIN_URL to the live site.
name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export the static mirror
        env:
          TWOHANDS_MAIN_URL: ${{ vars.MAIN_URL }}
        run: python -m app.export_static out/
      - name: Refuse anything that is not a masked image
        run: |
          if find out -path "*raw*" | grep -q .; then echo "raw path in mirror"; exit 1; fi
          if find out -name "*.jpg" ! -path "out/masked/*" ! -path "out/crop/*" ! -path "out/static/*" | grep -q .; then
            echo "image outside masked/crop/static"; exit 1; fi
          du -sh out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
