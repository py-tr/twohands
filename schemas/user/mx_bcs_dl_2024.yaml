  - {key: NULOS, csv: NULOS, vote: true, public: {code: NULOS, name: Null votes}, label: {keywords: [NULO]}, box: [0.59, 0.5858, 0.658, 0.6527], words_box: [0.392, 0.5858, 0.59, 0.6527]}
