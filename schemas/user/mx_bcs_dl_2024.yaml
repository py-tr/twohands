prompt_form: '''Acta de Escrutinio y Computo de Casilla de la eleccion de Diputaciones Locales'' (Baja California Sur local
  form, type 2)'

prompt_issuer: IEEBCS

source:
  election: diputaciones locales
  tipo_acta: '02'
  prep_zip: https://prep2024.ieebcs.org.mx/bdatos/20240603_2001_PREP_BCS.zip
  prep_csv: data/raw/ieebcs/bdatos/20240603_2001_PREP_DIP_LOC_BCS/BCS_DIP_LOC_2024.csv
  results_dir: results/ieebcs
  masked_dir: data/masked/ieebcs
  protocol: PROTOCOL_IEEBCS.md
  official: results/ieebcs/official.json
  readers: [gemma, qwen]
  computos_csv: null

party_aliases:
  JUNTOS: [JUNTOS, JUNTOS POR BCS, PAN, PRI, PRD, PRS, PHBCS]
  MORENA_CC: [MORENA, PT, PVEM, VERDE, NABCS, NUEVA ALIANZA]
  MC: [MC, MOVIMIENTO CIUDADANO]
  FXM: [FXM, FUERZA POR MEXICO, FUERZA MEXICO]
  ML: [ML, MOVIMIENTO LABORISTA, LABORISTA]
  PES: [PES, ENCUENTRO SOLIDARIO]

variants:
  sin_pes:
    why: the districts with no PES candidacy print one section-6 row fewer (taller rows, same frame); PREP shows '-' in the
      PES column
    drop: [PES]
    rows:
      CC_PAN_PRI_PRD_PRS_PHBCS: [0.1172, 0.1924]
      CC_PT_PVEM_MORENA_NABCS: [0.1924, 0.267]
      MC: [0.267, 0.3415]
      FXM: [0.3415, 0.4161]
      ML: [0.4161, 0.491]
      NO_REGISTRADOS: [0.491, 0.5656]
      NULOS: [0.5656, 0.6399]
      TOTAL: [0.6399, 0.7145]
    layout:
      template: mx_bcs_dl_2024.sin_pes.template.npy
      reference: mx_bcs_dl_2024.sin_pes.reference.npy
      landmarks: mx_bcs_dl_2024.sin_pes.landmarks.npy
      feature_ref: mx_bcs_dl_2024.sin_pes.feature_ref.jpg

identities:
  - {name: rows sum to TOTAL, sum: '@vote', equals: [TOTAL]}
  - {name: votaron + representantes = section 5, sum: [VOTARON, REPRESENTANTES], equals: [PERSONAS_Y_REP]}
  - {name: section 5 = section 7, sum: [PERSONAS_Y_REP], equals: [SACADOS]}
  - {name: section 7 = TOTAL, sum: [SACADOS], equals: [TOTAL]}
