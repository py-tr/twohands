  - {key: MC, csv: MC, vote: true, public: {code: OPT03, name: Option 03}, label: {parties: [MC]}, box: [0.59, 0.2497, 0.658, 0.3169], words_box: [0.392, 0.2497, 0.59, 0.3169]}
  - {key: FXM, csv: FXM, vote: true, public: {code: OPT04, name: Option 04}, label: {parties: [FXM]}, box: [0.59, 0.3169, 0.658, 0.3841], words_box: [0.392, 0.3169, 0.59, 0.3841]}
