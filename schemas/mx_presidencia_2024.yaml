# Form schema: INE Mexico 2024 "Acta de Escrutinio y Computo de Casilla de la eleccion de Presidencia" (type 2).
# A new form type = a new file like this one: page geometry (markers, privacy mask, tiles),
# the ordered fields with the printed row label expected at each position, and the form's own identities.
# All coordinates are fractions of the canonical (rectified) page: [x0, y0, x1, y1].
form: mx_presidencia_2024
title: "INE 2024 Acta de Escrutinio y Computo de Casilla, Presidencia"

layout:
  canonical:
    size: [2400, 1552]            # px of the rectified page (aspect of the 4082x2640 CATD scan)
    # centres of the four black corner markers, TL, TR, BR, BL (measured on CATD scans)
    markers: [[0.021, 0.040], [0.964, 0.040], [0.964, 0.954], [0.021, 0.954]]
    marker_size: 0.0242           # marker side / frame width
  template: mx_presidencia_2024.template.npy   # 96x62 orientation template (masked area zeroed)
  landmarks: mx_presidencia_2024.landmarks.npy # 1200x776 landmark reference (mean aligned pilot page, Amendment 1)
  reference: mx_presidencia_2024.reference.npy # 600x388 fine-alignment reference (mean page, masked area zeroed)
  # PRIVACY MASK: sections 10-12 (funcionarios/as de mesa directiva: names + signatures;
  # representaciones partidistas: names + signatures) plus 13-14, i.e. the whole right column.
  # Both capture layouts are rectified onto the same canonical page first, so the rectangles coincide;
  # they are listed per layout so a layout-specific override is one line.
  mask:
    movil:   [[0.657, 0.0, 1.0, 1.0]]
    escaner: [[0.657, 0.0, 1.0, 1.0]]
  # Gate-input regions (must stay visible and inside a tile; checked by tests/test_mask.py)
  field_regions:
    left_column_sec2_5: [0.0, 0.50, 0.335, 0.95]   # sobrantes, votaron, representantes, total personas
    section6_rows:      [0.335, 0.085, 0.650, 0.715] # 18 rows, words + digit boxes
    section7_sacados:   [0.335, 0.72, 0.650, 0.80]   # total de votos sacados de las urnas
  # Zoomed tiles sent with the full page (v2 crops, right edge pulled in from 0.69 to the mask edge,
  # plus enlarged strips of the party and coalition logo cells so the row labels are legible)
  tiles:
    - {name: left_column, box: [0.0, 0.47, 0.37, 1.0], says: "the left column (sections 2-5)"}
    - {name: party_rows, box: [0.29, 0.08, 0.657, 0.40], says: "the 7 single-party rows (PAN..MORENA)"}
    - {name: coalition_rows, box: [0.29, 0.33, 0.657, 0.66], says: "the 8 coalition rows (Coalicion 1: 4 rows, Coalicion 2: 4 rows)"}
    - {name: bottom_rows_sec7, box: [0.29, 0.58, 0.657, 0.90], says: "NO REGISTRADAS, NULOS, TOTAL and section 7"}
    - {name: party_logos, box: [0.335, 0.11, 0.392, 0.355], says: "the logo cells of the 7 single-party rows, enlarged (for the labels)"}
    - {name: coalition_logos, box: [0.335, 0.345, 0.392, 0.615], says: "the logo cells of the 8 coalition rows, enlarged (for the labels)"}

# Ordered as the reader returns them. label: what is printed next to the value.
#   parties: the set of party logos printed on that row (aliases below); keywords: all must appear,
#   none: none may appear (accent- and case-insensitive).
fields:
  - {key: SOBRANTES,      csv: TOTAL_BOLETAS_SOBRANTES,      where: "section 2 Boletas sobrantes",                       label: {keywords: [SOBRANTE]}}
  - {key: VOTARON,        csv: TOTAL_PERSONAS_VOTARON,       where: "section 3 Personas de la lista nominal que votaron", label: {keywords: [LISTA], none: [REPRESENTA]}}
  - {key: REPRESENTANTES, csv: TOTAL_REP_PARTIDO_CI_VOTARON, where: "section 4 Representaciones partidistas que votaron", label: {keywords: [REPRESENTA], none: [TOTAL, LISTA]}}
  - {key: PERSONAS_Y_REP, csv: null,                         where: "section 5 Total de personas y representantes que votaron", label: {keywords: [TOTAL, PERSONAS]}}
  - {key: SACADOS,        csv: TOTAL_VOTOS_SACADOS,          where: "section 7 Total de votos sacados de las urnas",      label: {keywords: [SACAD]}}
  - {key: PAN,            csv: PAN,            vote: true, label: {parties: [PAN]}}
  - {key: PRI,            csv: PRI,            vote: true, label: {parties: [PRI]}}
  - {key: PRD,            csv: PRD,            vote: true, label: {parties: [PRD]}}
  - {key: PVEM,           csv: PVEM,           vote: true, label: {parties: [PVEM]}}
  - {key: PT,             csv: PT,             vote: true, label: {parties: [PT]}}
  - {key: MC,             csv: MC,             vote: true, label: {parties: [MC]}}
  - {key: MORENA,         csv: MORENA,         vote: true, label: {parties: [MORENA]}}
  - {key: PAN_PRI_PRD,    csv: PAN-PRI-PRD,    vote: true, label: {parties: [PAN, PRI, PRD]}}
  - {key: PAN_PRI,        csv: PAN-PRI,        vote: true, label: {parties: [PAN, PRI]}}
  - {key: PAN_PRD,        csv: PAN-PRD,        vote: true, label: {parties: [PAN, PRD]}}
  - {key: PRI_PRD,        csv: PRI-PRD,        vote: true, label: {parties: [PRI, PRD]}}
  - {key: PVEM_PT_MORENA, csv: PVEM_PT_MORENA, vote: true, label: {parties: [PVEM, PT, MORENA]}}
  - {key: PVEM_PT,        csv: PVEM_PT,        vote: true, label: {parties: [PVEM, PT]}}
  - {key: PVEM_MORENA,    csv: PVEM_MORENA,    vote: true, label: {parties: [PVEM, MORENA]}}
  - {key: PT_MORENA,      csv: PT_MORENA,      vote: true, label: {parties: [PT, MORENA]}}
  - {key: NO_REGISTRADAS, csv: NO_REGISTRADAS, vote: true, label: {keywords: [REGISTRAD]}}
  - {key: NULOS,          csv: NULOS,          vote: true, label: {keywords: [NULO]}}
  - {key: TOTAL,          csv: TOTAL_VOTOS_ASENTADO,         label: {keywords: [TOTAL], none: [NULO, SACAD, PERSONAS, REGISTRAD]}}

party_aliases:
  PAN: [PAN, ACCION NACIONAL]
  PRI: [PRI, REVOLUCIONARIO INSTITUCIONAL]
  PRD: [PRD, REVOLUCION DEMOCRATICA]
  PVEM: [PVEM, VERDE]
  PT: [PT, DEL TRABAJO]
  MC: [MC, MOVIMIENTO CIUDADANO]
  MORENA: [MORENA]

identities:
  - {name: "rows sum to TOTAL", sum: "@vote", equals: [TOTAL]}
  - {name: "votaron + representantes = section 5", sum: [VOTARON, REPRESENTANTES], equals: [PERSONAS_Y_REP]}
  - {name: "section 5 = section 7", sum: [PERSONAS_Y_REP], equals: [SACADOS]}
  - {name: "section 7 = TOTAL", sum: [SACADOS], equals: [TOTAL]}
